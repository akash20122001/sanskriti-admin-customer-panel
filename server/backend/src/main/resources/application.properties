# ===============================================
# Server (replaces PORT in .env)
# ===============================================
# Using 8080 during migration (Node.js backend already uses 5000)
# Change back to 5000 when Node.js backend is fully retired
server.port=8081

# ===============================================
# Database (replaces DATABASE_URL in .env)
# ===============================================
spring.datasource.url=jdbc:mysql://localhost:3306/sanskriti_db
spring.datasource.username=root
spring.datasource.password=Akash@2012
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate settings
# 'none' = Flyway owns schema creation. Hibernate only reads/writes data.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# CRITICAL: Prisma uses camelCase column names (walletBalance, companyAddress).
# By default, Hibernate converts camelCase → snake_case (wallet_balance).
# This strategy tells Hibernate to use the EXACT field names as column names.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ===============================================
# Flyway (Database Migrations)
# SQL migration files live in: src/main/resources/db/migration
# Naming convention: V{version}__{description}.sql  (e.g. V2__add_phone_column.sql)
# baseline-on-migrate: For QA/prod DBs already populated by Prisma,
#   Flyway will mark V1 as "already applied" without re-running it.
# ===============================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ===============================================
# JWT (replaces JWT_SECRET, JWT_REFRESH_SECRET)
# IMPORTANT: Secrets must be at least 32 characters (256 bits) for HMAC-SHA256
# Expiration in milliseconds: 7 days = 604800000, 30 days = 2592000000
# ===============================================
app.jwt.secret=dev-secret-key-change-in-production
app.jwt.expiration=604800000
app.jwt.refresh-secret=dev-refresh-secret-key-change-in-production
app.jwt.refresh-expiration=2592000000

